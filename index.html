<!DOCTYPE html>
<html lang="te">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WashBook</title>
<meta name="theme-color" content="#087FA3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WashBook">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&display=swap">
<style>
/* ================= WashBook design system (v2) =================
   All colours, type, spacing, radius and shadows live here.
   Screens use these tokens; nothing else should hard-code a value. */
:root{
  /* brand: one place to change a shop's colour */
  --primary:#087FA3; --primary-600:#066A89; --primary-700:#05566F; --primary-deep:#05566F; --primary-50:#E8F4F8; --primary-100:#CDE7F0;
  --navy:#102D3A;
  /* text */
  --text:#102D3A; --text-2:#4B6371; --text-3:#5F737E;
  /* surfaces */
  --bg:#F3F7F9; --surface:#FFFFFF; --surface-2:#F7FAFB; --border:#E9EFF3; --border-strong:#D3DFE5;
  /* status */
  --success:#16A36A; --success-600:#0B7A4E; --success-50:#E8F6EF;
  --warning:#C2410C; --warning-50:#FEF0E6;
  --danger:#C62F2A; --danger-50:#FDECEB;
  --wa:#0F7F42;                                  /* WhatsApp button (white text passes contrast) */
  /* payment methods: the same colour everywhere */
  --pay-cash:var(--success-600); --pay-upi:var(--primary); --pay-card:var(--navy); --pay-later:var(--warning);
  /* type */
  --font:"Inter","Noto Sans Telugu","Nirmala UI",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fs-amount:28px; --fs-title:22px; --fs-section:17px; --fs-btn:16px; --fs-body:15px; --fs-label:13px; --fs-caption:12px;
  --fw-regular:400; --fw-medium:500; --fw-semibold:600; --fw-bold:700;
  --lh:1.45; --lh-tight:1.2;
  /* 8px grid */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
  /* shape */
  --r-sm:8px; --r-btn:12px; --r-card:16px; --r-pill:999px;
  --sh-1:0 1px 2px rgba(16,45,58,.04),0 1px 3px rgba(16,45,58,.06);
  --sh-2:0 4px 14px rgba(16,45,58,.08);
  --sh-3:0 12px 32px rgba(16,45,58,.18);
  --h-control:50px; --tap:48px;
  /* older names, kept so every existing screen keeps working */
  --ink:var(--text); --muted:var(--text-2); --line:var(--border); --sunk:#EBF2F5; --on:#FFFFFF;
  --wash:var(--primary); --good:var(--success-600); --good-bg:var(--success-50); --bad:var(--danger); --bad-bg:var(--danger-50); --warn:var(--warning); --warn-bg:var(--warning-50);
  --cust:#1C8556; --exp:#B86E12; --close:#5040A8;   /* home tiles: replaced in phase 2 */
  --logo-bg:#DDF0F6; --logo-drop:#2A9CC6; --logo-win:#CFEAF5;
}
@media (prefers-color-scheme: dark){:root{
  --primary:#2C9EC4; --primary-600:#2590B4; --primary-700:#9FD3E6; --primary-deep:#0B5C78; --primary-50:#10303B; --primary-100:#164452;
  --navy:#C9DCE4;
  --text:#E6F0F4; --text-2:#9DB2BC; --text-3:#7B919C;
  --bg:#0A171D; --surface:#12232B; --surface-2:#0F1E25; --border:#1E3640; --border-strong:#2A4753;
  --success:#3CC489; --success-600:#1E9E66; --success-50:#10301F;
  --warning:#F08A4B; --warning-50:#3A2414; --danger:#F06E62; --danger-50:#3D1B18; --wa:#1B9A52;
  --pay-card:#4E6B7A;
  --sh-1:none; --sh-2:0 4px 14px rgba(0,0,0,.35); --sh-3:0 12px 32px rgba(0,0,0,.5);
  --sunk:#0F2027; --cust:#2EA06C; --exp:#D08A2A; --close:#7565CC; --logo-bg:#14313B; --logo-drop:#4FB8DE; --logo-win:#9FD3E6; color-scheme:dark}}

/* ---------- base ---------- */
html{-webkit-text-size-adjust:100%}
body{font-size:var(--fs-body);font-weight:var(--fw-regular);line-height:var(--lh);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
html[lang="te"] body{line-height:1.6}                       /* Telugu needs room above and below */
html[lang="te"] .btn,html[lang="te"] .big{line-height:1.4}
h1{font-size:var(--fs-title);font-weight:var(--fw-bold);line-height:var(--lh-tight);letter-spacing:-.01em}
h2{font-size:var(--fs-section);font-weight:var(--fw-semibold);color:var(--text);text-transform:none;letter-spacing:0}

/* ---------- icons (Lucide, inline sprite) ---------- */
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
.ico.sm{width:16px;height:16px;vertical-align:-3px}.ico.lg{width:24px;height:24px}.ico.xl{width:32px;height:32px}.ico.xxl{width:44px;height:44px;stroke-width:1.75}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);min-height:var(--h-control);padding:var(--sp-2) var(--sp-5);
  border-radius:var(--r-btn);border:1px solid transparent;font-size:var(--fs-btn);font-weight:var(--fw-semibold);line-height:var(--lh-tight);
  text-decoration:none;text-align:center;cursor:pointer;transition:transform .08s ease,background-color .15s ease,box-shadow .15s ease;color:var(--text);background:var(--surface)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-primary{background:var(--primary);color:#fff}
.btn-success{background:var(--success-600);color:#fff}
.btn-wa{background:var(--wa);color:#fff}
.btn-navy{background:var(--navy);color:var(--surface)}
.btn-danger{background:var(--danger);color:#fff}
.btn-outline{background:var(--surface);border-color:var(--border-strong);color:var(--text)}
.btn-soft{background:var(--primary-50);color:var(--primary-700)}
.btn-ghost{background:transparent;color:var(--primary);padding-left:var(--sp-2);padding-right:var(--sp-2)}
.btn-block{display:flex;width:100%}
.btn-sm{min-height:36px;padding:0 var(--sp-3);font-size:14px;border-radius:10px}
.btn-icon{width:var(--tap);min-height:var(--tap);padding:0}

/* ---------- cards & lists ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--sh-1);padding:var(--sp-4)}
.card-tight{padding:var(--sp-3)}
.list-card{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--sh-1)}
.section-title{display:flex;align-items:center;justify-content:space-between;font-size:var(--fs-section);font-weight:var(--fw-semibold);color:var(--text);margin:var(--sp-2) 0 0}
.divider{height:1px;background:var(--border);border:0;margin:0}

/* ---------- form fields ---------- */
.label{display:block;font-size:var(--fs-label);font-weight:var(--fw-medium);color:var(--text-2);margin-bottom:6px}
.input{width:100%;height:var(--h-control);padding:0 var(--sp-4);border:1px solid var(--border-strong);border-radius:var(--r-btn);background:var(--surface);
  font-size:16px;color:var(--text);transition:border-color .15s,box-shadow .15s}
.input::placeholder{color:var(--text-3)}
.input:focus,.field:focus,.plate-in:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-100)}
.input-group{position:relative}.input-group .ico{position:absolute;left:14px;top:50%;margin-top:-10px;color:var(--text-3)}.input-group .input{padding-left:44px}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:4px;min-height:22px;padding:0 var(--sp-2);border-radius:var(--r-pill);font-size:var(--fs-caption);font-weight:var(--fw-semibold);line-height:1.2;white-space:nowrap}
.badge-success{background:var(--success-50);color:var(--success-600)}
.badge-warning{background:var(--warning-50);color:var(--warning)}
.badge-danger{background:var(--danger-50);color:var(--danger)}
.badge-info{background:var(--primary-50);color:var(--primary-700)}
.badge-neutral{background:var(--sunk);color:var(--text-2)}

/* ---------- feedback ---------- */
.spinner{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--primary-100);border-top-color:var(--primary);animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ================= Layout ================= */
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));min-height:100vh;min-height:100dvh}
body.has-nav{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
body.has-paybar{padding-bottom:calc(196px + env(safe-area-inset-bottom,0px))}
.app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:var(--sp-4)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid var(--primary-100);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.ico.xs{width:14px;height:14px;vertical-align:-2px}
.ico.spin{animation:spin 1s linear infinite}
.main{flex:1;min-width:0}
.sub{display:block;font-size:var(--fs-label);color:var(--text-2);overflow-wrap:anywhere;line-height:1.4}
.sub .ico{margin-right:4px}
.sub.warn{color:var(--warning);font-weight:var(--fw-medium)}.sub.good{color:var(--success-600);font-weight:var(--fw-medium)}
.plate{font-weight:var(--fw-bold);letter-spacing:.02em;overflow-wrap:anywhere}
.hint{font-size:var(--fs-label);color:var(--text-2);text-align:center;margin:0}
.label .opt,.label .req{font-weight:var(--fw-regular);color:var(--text-3)}.label .req{color:var(--danger)}
.center{display:flex;flex-direction:column;align-items:center;gap:var(--sp-3);padding:48px 0;color:var(--text-2);font-weight:var(--fw-medium)}
.spinner.sm{width:14px;height:14px;border-width:2px;vertical-align:-2px;margin-right:6px}

/* ================= Header ================= */
.top{display:flex;align-items:center;gap:var(--sp-2);min-height:44px}
.hd{gap:var(--sp-3)}
.hd-brand{flex:1;min-width:0;display:flex;align-items:center;gap:var(--sp-3)}
.hd-txt{min-width:0;display:flex;flex-direction:column}
.hd-name,.brandbtn{font-size:var(--fs-section);font-weight:var(--fw-bold);line-height:1.25;overflow-wrap:anywhere}
.hd-date{font-size:var(--fs-caption);color:var(--text-2)}
.hd-act{display:flex;align-items:center;gap:var(--sp-2);margin-left:auto;flex:none}
.brandbtn{border:0;background:transparent;padding:0;display:flex;align-items:center;gap:4px;text-align:left;color:inherit}
.brandbtn .car{color:var(--text-2);transition:transform .15s}.brandbtn[aria-expanded="true"] .car{transform:rotate(180deg)}
.back{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 var(--sp-3) 0 var(--sp-2);border:1px solid var(--border);background:var(--surface);border-radius:var(--r-btn);font-size:var(--fs-label);font-weight:var(--fw-semibold);color:var(--text);box-shadow:var(--sh-1)}
.ptitle{margin:0}
.lang{flex:none;min-width:40px;height:36px;padding:0 10px;border-radius:var(--r-pill);border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:var(--fw-semibold);line-height:1;box-shadow:var(--sh-1)}
.sync{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:2px;height:36px;min-width:36px;padding:0 10px;border:0;border-radius:var(--r-pill);background:var(--success-50);color:var(--success-600);font-size:13px;font-weight:var(--fw-semibold)}
.sync.wait{background:var(--warning-50);color:var(--warning)}.sync.off{background:var(--danger-50);color:var(--danger)}
.bmenu{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--sh-2);overflow:hidden;margin-top:calc(-1 * var(--sp-2))}
.bm-row{display:flex;align-items:center;gap:var(--sp-3);width:100%;padding:var(--sp-3) var(--sp-4);border:0;border-top:1px solid var(--border);background:transparent;text-align:left}
.bm-row:first-child{border-top:0}.bm-row.here{background:var(--primary-50)}
.bm-ic{width:36px;height:36px;border-radius:10px;background:var(--sunk);color:var(--text-2);display:grid;place-items:center;flex:none}
.bname{display:block;font-weight:var(--fw-semibold)}.tick{color:var(--primary)}
.btot{font-weight:var(--fw-semibold);background:var(--surface-2);justify-content:space-between}

/* ================= Brand mark (logo) ================= */
.bmark{--s:40px;position:relative;flex:none;width:var(--s);height:var(--s);border-radius:calc(var(--s) * .28);display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(140deg,var(--primary) 0%,var(--primary-deep) 100%);color:#fff;box-shadow:0 2px 6px rgba(16,45,58,.18)}
.bmark b{font-size:calc(var(--s) * .4);font-weight:var(--fw-bold);letter-spacing:.02em;line-height:1}
.bmark .bm-drop{position:absolute;right:calc(var(--s) * .08);bottom:calc(var(--s) * .06);opacity:.55;display:flex}
.bmark .bm-drop .ico{width:calc(var(--s) * .26);height:calc(var(--s) * .26)}
.bmark img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--surface)}
.bmark.bm-car{background:var(--logo-bg);box-shadow:none}.bmark.bm-car .logo{display:block;max-width:none}

/* ================= Banners, empty states, confirm ================= */
.banner{display:flex;align-items:flex-start;gap:var(--sp-2);border-radius:var(--r-btn);padding:var(--sp-3);font-size:var(--fs-label);font-weight:var(--fw-medium);line-height:1.45}
.banner>.ico{flex:none;margin-top:1px}.banner>span{flex:1;min-width:0}
.b-good{background:var(--success-50);color:var(--success-600)}.b-bad{background:var(--danger-50);color:var(--danger)}.b-warn{background:var(--warning-50);color:var(--warning)}
.duebar{align-items:center}.duebar .btn{flex:none}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:var(--sp-5) var(--sp-4);background:var(--surface);border:1px dashed var(--border-strong);border-radius:var(--r-card);color:var(--text-2);font-size:var(--fs-label)}
.empty b{color:var(--text);font-size:var(--fs-body);font-weight:var(--fw-semibold)}
.empty-ic{width:64px;height:64px;border-radius:50%;background:var(--primary-50);color:var(--primary);display:grid;place-items:center;margin-bottom:4px}
.confirm{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;padding:var(--sp-3);margin-top:-4px;background:var(--danger-50);color:var(--danger);border-radius:0 0 var(--r-card) var(--r-card);font-size:var(--fs-label);font-weight:var(--fw-semibold)}
.confirm>span{flex:1;min-width:140px;display:flex;align-items:center;gap:6px}
.confirm.go{background:var(--success-50);color:var(--success-600);border-radius:var(--r-btn);margin-top:0}

/* ================= 1. PIN ================= */
body.is-login{background:radial-gradient(120% 60% at 50% -10%,var(--primary-100) 0%,var(--bg) 60%) var(--bg) no-repeat}
.login{display:flex;flex-direction:column;align-items:center;gap:var(--sp-4);min-height:calc(100dvh - 48px);padding-bottom:var(--sp-2)}
.lg-top{align-self:stretch;display:flex;justify-content:flex-end}
.lg-brand{display:flex;flex-direction:column;align-items:center;gap:var(--sp-2);margin-top:var(--sp-3)}
.lg-brand .bmark{box-shadow:0 10px 24px rgba(16,45,58,.18)}
.lg-shop{font-size:var(--fs-title);font-weight:var(--fw-bold);text-align:center;line-height:1.25;margin-top:var(--sp-2)}
.lg-app{font-size:var(--fs-caption);font-weight:var(--fw-semibold);letter-spacing:.12em;text-transform:uppercase;color:var(--text-3)}
.lg-prompt{display:flex;align-items:center;gap:6px;font-weight:var(--fw-medium);color:var(--text-2);margin-top:var(--sp-2)}
.pindots{display:flex;gap:20px;height:18px}
.pindots span{width:16px;height:16px;border-radius:50%;border:2px solid var(--border-strong);background:var(--surface);transition:background .12s,border-color .12s,transform .12s}
.pindots span.on{background:var(--primary);border-color:var(--primary);transform:scale(1.08)}
.pindots.bad span{border-color:var(--danger)}
.shake{animation:shake .38s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.err{min-height:22px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--danger);font-size:var(--fs-label);font-weight:var(--fw-semibold);text-align:center}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px 24px}
.pad button{width:76px;height:76px;border-radius:50%;border:1px solid var(--border);background:var(--surface);font-size:28px;font-weight:var(--fw-medium);color:var(--text);box-shadow:var(--sh-1);display:grid;place-items:center;transition:transform .08s,background .12s}
.pad button:active{transform:scale(.94);background:var(--primary-50)}
.pad .del{background:transparent;border-color:transparent;box-shadow:none;color:var(--text-2)}
.pad .okk{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(8,127,163,.3)}
.lg-ver{margin-top:auto;font-size:11px;color:var(--text-3)}
.lg-pick{display:flex;flex-direction:column;gap:var(--sp-3);width:100%;max-width:300px}
.lg-pick .lg-brand{margin-bottom:var(--sp-4)}
.lg-pick .label{margin:0}

/* ================= 5/6. Dashboard ================= */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
.kpis.three{grid-template-columns:repeat(3,1fr)}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--sh-1);padding:var(--sp-4);display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--primary-50);color:var(--primary);margin-bottom:var(--sp-2)}
.kpi-ic.k-rev{background:var(--success-50);color:var(--success-600)}
.kpi-lb{font-size:var(--fs-label);color:var(--text-2);font-weight:var(--fw-medium);line-height:1.35}
.kpi-v{font-size:var(--fs-amount);font-weight:var(--fw-bold);line-height:1.15;letter-spacing:-.01em;overflow-wrap:anywhere}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
.qa-card{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:118px;padding:var(--sp-4);text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--sh-1);color:var(--text);transition:transform .08s,box-shadow .15s}
.qa-card:active{transform:scale(.98)}
.qa-card:disabled{opacity:.5;cursor:not-allowed}
.qa-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--primary-50);color:var(--primary);margin-bottom:auto}
.qa-lb{font-size:var(--fs-btn);font-weight:var(--fw-semibold);line-height:1.3;margin-top:var(--sp-3)}
.qa-sub{font-size:var(--fs-caption);color:var(--text-2)}
.qa-primary{background:linear-gradient(150deg,var(--primary) 0%,var(--primary-deep) 100%);border-color:transparent;color:#fff;box-shadow:0 8px 20px rgba(8,127,163,.25)}
.qa-primary .qa-ic{background:rgba(255,255,255,.18);color:#fff}.qa-primary .qa-sub{color:rgba(255,255,255,.85)}
.sec{display:flex;align-items:center;gap:var(--sp-2);margin-top:var(--sp-1)}
.sec h2{margin:0;flex:1}
.sec-n{min-width:24px;height:24px;padding:0 8px;border-radius:var(--r-pill);background:var(--sunk);color:var(--text-2);font-size:var(--fs-caption);font-weight:var(--fw-semibold);display:inline-grid;place-items:center}
.cards{display:flex;flex-direction:column;gap:var(--sp-2)}
.txw{display:flex;flex-direction:column}
.tx{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:var(--sp-3);width:100%;padding:var(--sp-3);text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--sh-1);color:var(--text)}
.avatar{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--primary-50);color:var(--primary)}
.avatar.sm{width:36px;height:36px;border-radius:10px}
.tx-main{min-width:0;display:flex;flex-direction:column;gap:1px}
.tx-main .plate{font-size:var(--fs-body)}
.tx-sub{font-size:var(--fs-caption);color:var(--text-2);overflow-wrap:anywhere}
.tx-svc{font-size:var(--fs-label);color:var(--text);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tx-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.tx-amt{font-size:var(--fs-btn);font-weight:var(--fw-bold)}
.pay{display:inline-flex;align-items:center;gap:4px;min-height:22px;padding:0 var(--sp-2);border-radius:var(--r-pill);font-size:var(--fs-caption);font-weight:var(--fw-semibold);white-space:nowrap}
.p-cash{background:var(--success-50);color:var(--pay-cash)}.p-upi{background:var(--primary-50);color:var(--primary-700)}.p-card{background:var(--sunk);color:var(--pay-card)}.p-credit{background:var(--warning-50);color:var(--pay-later)}
/* manager home */
.mhello{font-size:var(--fs-title);font-weight:var(--fw-bold);line-height:1.25}
.mbig{display:flex;align-items:center;gap:var(--sp-4);width:100%;min-height:132px;padding:var(--sp-5);border:0;border-radius:20px;text-align:left;color:#fff;
  background:linear-gradient(150deg,var(--primary) 0%,var(--primary-deep) 100%);box-shadow:0 10px 24px rgba(8,127,163,.28)}
.mbig:active{transform:scale(.98)}.mbig:disabled{opacity:.5}
.mic{width:64px;height:64px;border-radius:18px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.mtx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mlb{font-size:24px;font-weight:var(--fw-bold);line-height:1.2}.msub{font-size:var(--fs-label);opacity:.9}
.mcount{flex-direction:row;align-items:center;gap:var(--sp-3)}
.mcount .kpi-ic{margin:0}.mcount .kpi-lb{flex:1}.mcount .kpi-v{font-size:26px}

/* ================= 2/3. New wash ================= */
.wsec{display:flex;flex-direction:column;gap:var(--sp-3)}
.wsec-h{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2)}
.wsec-t{display:flex;align-items:center;gap:6px;font-size:var(--fs-label);font-weight:var(--fw-semibold);color:var(--text-2);text-transform:uppercase;letter-spacing:.06em}
html[lang="te"] .wsec-t{text-transform:none;letter-spacing:0;font-size:var(--fs-body)}
.input-group.ig-lg .ico{margin-top:-10px;left:16px}
.input-group.ig-lg .plate-in{padding-left:48px}
.plate-in{width:100%;height:56px;padding:0 var(--sp-4);border:1px solid var(--border-strong);border-radius:var(--r-btn);background:var(--surface);font-size:20px;font-weight:var(--fw-bold);letter-spacing:.04em;text-transform:uppercase;color:var(--text);transition:border-color .15s,box-shadow .15s}
.plate-in::placeholder{text-transform:none;letter-spacing:0;font-weight:var(--fw-regular);font-size:16px;color:var(--text-3)}
.input.up{text-transform:uppercase;font-weight:var(--fw-semibold);letter-spacing:.03em}
.input.area{height:auto;min-height:104px;padding:var(--sp-3) var(--sp-4);line-height:1.5;resize:vertical}
.picked{display:flex;align-items:flex-start;gap:var(--sp-3)}
.picked .main{display:flex;flex-direction:column;gap:2px}
.pk-plate{font-size:20px}
.btn-icon.x{flex:none;width:40px;min-height:40px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);display:grid;place-items:center}
.phonebox{display:flex;flex-direction:column}
.phonebox .input{font-size:18px;font-weight:var(--fw-semibold);letter-spacing:.02em}
.phonebox.bad .input{border-color:var(--danger)}
.field-err{font-size:var(--fs-caption);color:var(--danger);margin-top:4px}
.match{display:flex;align-items:center;gap:var(--sp-3);width:100%;padding:var(--sp-3);border:1px solid var(--border);background:var(--surface-2);border-radius:var(--r-btn);text-align:left;color:var(--text)}
.match .main{display:flex;flex-direction:column}
.newveh{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;padding:var(--sp-3);border:1px dashed var(--primary);background:var(--primary-50);border-radius:var(--r-btn)}
.nv-ic{width:36px;height:36px;border-radius:10px;background:var(--surface);color:var(--primary);display:grid;place-items:center;flex:none}
.nv-txt{flex:1;min-width:120px;display:flex;flex-direction:column}
.nv-txt b{font-size:var(--fs-section);letter-spacing:.03em}
.addf{display:flex;flex-direction:column;gap:var(--sp-3)}
.dots{display:flex;gap:4px;margin-top:4px}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--primary)}.dot.on{background:var(--primary)}
.vcat{font-size:var(--fs-label);font-weight:var(--fw-semibold);color:var(--text-2);margin:var(--sp-1) 0 calc(-1 * var(--sp-2))}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2)}
.vbtn{display:flex;align-items:center;gap:var(--sp-3);min-height:64px;padding:var(--sp-2) var(--sp-3);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-btn);box-shadow:var(--sh-1);text-align:left;color:var(--text)}
.vbtn:active{transform:scale(.98);border-color:var(--primary)}
.vic{width:40px;height:40px;border-radius:10px;background:var(--primary-50);color:var(--primary);display:grid;place-items:center;flex:none}
.vn{font-size:var(--fs-label);font-weight:var(--fw-semibold);line-height:1.3;min-width:0;overflow-wrap:anywhere}
.vchosen{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3);background:var(--surface);border:1px solid var(--primary);border-radius:var(--r-card);box-shadow:0 0 0 3px var(--primary-50)}
.vc-txt{flex:1;min-width:0;display:flex;flex-direction:column}.vc-txt b{font-weight:var(--fw-semibold);overflow-wrap:anywhere}
.svc{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2)}
.svcb{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:112px;padding:var(--sp-3);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--sh-1);text-align:left;color:var(--text);transition:background .12s,border-color .12s}
.svc-top{display:flex;align-items:center;justify-content:space-between;width:100%;margin-bottom:var(--sp-1)}
.svc-ic{width:36px;height:36px;border-radius:10px;background:var(--sunk);color:var(--text-2);display:grid;place-items:center}
.svc-tick{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--border-strong);display:grid;place-items:center;color:transparent;transition:all .12s}
.svcb .n{font-size:var(--fs-label);font-weight:var(--fw-semibold);line-height:1.3}
.svcb .p{font-size:var(--fs-btn);font-weight:var(--fw-bold);margin-top:auto}
.svcb[aria-pressed="true"]{background:var(--primary-50);border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.svcb[aria-pressed="true"] .svc-ic{background:var(--primary);color:#fff}
.svcb[aria-pressed="true"] .svc-tick{background:var(--primary);border-color:var(--primary);color:#fff}
.paybar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--border);box-shadow:0 -8px 24px rgba(16,45,58,.08);
  padding:var(--sp-3) max(16px,env(safe-area-inset-right,0px)) calc(var(--sp-3) + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.paybar>*{max-width:480px;margin-left:auto;margin-right:auto}
.total{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-2)}
.pb-n{font-size:var(--fs-label);font-weight:var(--fw-medium);color:var(--text-2)}
.total b{font-size:var(--fs-amount);font-weight:var(--fw-bold);line-height:1.1}
.total s{font-size:var(--fs-btn);color:var(--text-3);font-weight:var(--fw-medium)}
.pb-hint{font-size:var(--fs-caption);color:var(--warning);margin:2px auto var(--sp-2);min-height:16px}
.pb-hint.ok{color:var(--text-2)}
.paybtns{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-2)}
.pb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:64px;padding:var(--sp-2) 2px;border-radius:var(--r-btn);border:0;color:#fff;font-size:var(--fs-label);font-weight:var(--fw-semibold);line-height:1.2;transition:transform .08s,opacity .15s}
.pb:active{transform:scale(.96)}
.pb:disabled{opacity:.3;cursor:not-allowed;transform:none}
.pb-cash{background:var(--pay-cash)}.pb-upi{background:var(--pay-upi)}.pb-card{background:var(--pay-card);color:var(--surface)}.pb-credit{background:var(--pay-later)}

/* ================= 4. Invoice ================= */
.okstrip{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3);background:var(--success-50);border-radius:var(--r-card);color:var(--success-600);animation:pop .35s ease-out}
.okstrip b{display:block;font-weight:var(--fw-semibold)}
.ok-ic{width:36px;height:36px;border-radius:50%;background:var(--success-600);color:#fff;display:grid;place-items:center;flex:none;animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.8);opacity:0}70%{transform:scale(1.04);opacity:1}100%{transform:scale(1)}}
.bill{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--sh-2);padding:var(--sp-5) var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-4);position:relative;overflow:hidden}
.bill::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--primary)}
.bill-head{display:flex;align-items:center;gap:var(--sp-3)}
.bh-txt{flex:1;min-width:0}
.bill-shop{font-size:var(--fs-section);font-weight:var(--fw-bold);line-height:1.25;overflow-wrap:anywhere}
.bill-tag{flex:none;font-size:var(--fs-caption);font-weight:var(--fw-semibold);letter-spacing:.1em;text-transform:uppercase;color:var(--primary);background:var(--primary-50);padding:4px 10px;border-radius:var(--r-pill)}
html[lang="te"] .bill-tag{letter-spacing:0}
.bill-meta{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);padding:var(--sp-3);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-btn)}
.bill-meta>div,.bill-sec>div{display:flex;flex-direction:column;min-width:0}
.bill-meta .label,.bill-sec .label{margin:0 0 2px;font-size:var(--fs-caption);display:flex;align-items:center;gap:4px}
.bill-meta b{font-size:var(--fs-label);font-weight:var(--fw-semibold)}
.bill-sec{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
.bill-sec b{font-size:var(--fs-body);font-weight:var(--fw-semibold);overflow-wrap:anywhere}
.bill-items{display:flex;flex-direction:column}
.bi{display:flex;justify-content:space-between;gap:var(--sp-3);padding:10px 0;border-bottom:1px solid var(--border);font-size:var(--fs-label)}
.bi-h{font-size:var(--fs-caption);font-weight:var(--fw-semibold);color:var(--text-2);text-transform:uppercase;letter-spacing:.06em;padding-top:0}
html[lang="te"] .bi-h{text-transform:none;letter-spacing:0}
.bi.good{color:var(--success-600);font-weight:var(--fw-semibold)}
.bi.tot{align-items:baseline;border:0;padding:var(--sp-3) var(--sp-4);margin:0 calc(-1 * var(--sp-4));background:var(--primary-50);font-size:var(--fs-section);font-weight:var(--fw-semibold)}
.bi.tot .num{font-size:var(--fs-amount);font-weight:var(--fw-bold);color:var(--text)}
.bill-pay{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}
.bill-pay .badge{min-height:28px;padding:0 12px;font-size:var(--fs-label)}
.bill-thanks{text-align:center;color:var(--text-2);font-size:var(--fs-label);padding-top:var(--sp-3);border-top:1px dashed var(--border-strong)}
.rewards{border:1px solid var(--border);border-radius:var(--r-btn);padding:var(--sp-3);display:flex;flex-direction:column;gap:var(--sp-2)}
.rw-h{display:flex;align-items:center;gap:6px;font-size:var(--fs-label)}.rw-h b{flex:1}.rw-h .ico{color:var(--warning)}
.rw-bar{display:flex;gap:4px}.rw-bar span{flex:1;height:8px;border-radius:var(--r-pill);background:var(--sunk);display:grid;place-items:center}
.rw-bar span.on{background:var(--success)}.rw-bar span.gift{height:20px;margin-top:-6px;background:var(--warning-50);color:var(--warning)}
.rw-msg{font-size:var(--fs-label);font-weight:var(--fw-semibold);color:var(--success-600)}
.actions{display:flex;flex-direction:column;gap:var(--sp-2)}
.stepn{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.2);font-size:12px;font-weight:var(--fw-bold);display:grid;place-items:center;flex:none}

/* ================= 7. Daily report ================= */
.daynav{display:flex;align-items:center;gap:var(--sp-2);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--sh-1);padding:var(--sp-2)}
.dn-btn{flex:none;width:48px;min-height:48px;border:0;border-radius:10px;background:var(--sunk);color:var(--text);display:grid;place-items:center}
.dn-btn:disabled{opacity:.35;cursor:not-allowed}
.dn-mid{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;font-size:var(--fs-label)}
.dn-mid b{font-weight:var(--fw-semibold)}.dn-mid .ico{color:var(--text-2);flex:none}
.dash-total{display:flex;flex-direction:column;gap:2px;padding:var(--sp-5);border-radius:20px;color:#fff;background:linear-gradient(150deg,var(--primary) 0%,var(--primary-deep) 100%);box-shadow:0 10px 24px rgba(8,127,163,.25)}
.dt-lb{font-size:var(--fs-label);font-weight:var(--fw-medium);opacity:.9}
.dash-total b{font-size:34px;font-weight:var(--fw-bold);line-height:1.15;letter-spacing:-.01em}
.dt-sub{display:flex;align-items:center;gap:6px;font-size:var(--fs-label);opacity:.9;margin-top:var(--sp-1)}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
.dtile{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--sh-1);padding:var(--sp-4);display:flex;flex-direction:column;gap:2px;overflow:hidden}
.dtile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.dt-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;margin-bottom:var(--sp-2);color:var(--c);background:var(--cb)}
.dlb{font-size:var(--fs-label);color:var(--text-2);font-weight:var(--fw-medium)}
.dtile b{font-size:22px;font-weight:var(--fw-bold);line-height:1.2}
.dcnt{font-size:var(--fs-caption);color:var(--text-3)}
.d-cash{--c:var(--pay-cash);--cb:var(--success-50)}.d-upi{--c:var(--pay-upi);--cb:var(--primary-50)}.d-card{--c:var(--pay-card);--cb:var(--sunk)}.d-credit{--c:var(--pay-later);--cb:var(--warning-50)}
.list{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--sh-1);overflow:hidden}
.list.cards{background:transparent;border:0;box-shadow:none;overflow:visible}
.row{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);border-top:1px solid var(--border);font-size:var(--fs-label)}
.row:first-child{border-top:0}
.row .main b{font-weight:var(--fw-semibold)}
.r-ic{width:32px;height:32px;border-radius:8px;background:var(--sunk);color:var(--text-2);display:grid;place-items:center;flex:none}
.amt{font-weight:var(--fw-semibold);text-align:right;flex:none}
.row.hl{background:var(--surface-2)}
.row.hl .main,.row.hl .amt{font-size:var(--fs-btn);font-weight:var(--fw-bold)}
.row.hl .r-ic{background:var(--success-50);color:var(--success-600)}
.trow{padding:var(--sp-3) var(--sp-4);border-top:1px solid var(--border);display:flex;flex-direction:column;gap:4px}
.trow:first-child{border-top:0}
.tr-h{display:flex;align-items:baseline;gap:var(--sp-2)}.tr-h .plate{font-size:var(--fs-body)}.tr-h .sub{flex:1}
.tr-tot{font-weight:var(--fw-bold)}
.tr-i{display:flex;justify-content:space-between;gap:var(--sp-2);font-size:var(--fs-caption);color:var(--text-2)}
.tr-i.good{color:var(--success-600)}
.tr-f{display:flex;align-items:center;gap:var(--sp-2);margin-top:2px}.tr-f .sub{font-size:var(--fs-caption)}

/* ================= 8. Customers ================= */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--sunk);border-radius:14px}
.seg button{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border:0;background:transparent;border-radius:10px;font-size:var(--fs-label);font-weight:var(--fw-semibold);color:var(--text-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--sh-1)}
.seg-n{font-size:var(--fs-caption);color:var(--text-3)}
.cnt{min-width:20px;height:20px;padding:0 6px;border-radius:var(--r-pill);background:var(--warning);color:#fff;font-size:11px;display:inline-grid;place-items:center}
.chips{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chips button{flex:none;min-height:36px;padding:0 14px;border:1px solid var(--border-strong);background:var(--surface);border-radius:var(--r-pill);font-size:var(--fs-label);font-weight:var(--fw-medium);color:var(--text-2)}
.chips button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--surface)}
.ccard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--sh-1);overflow:hidden}
.ccard.here{border-color:var(--primary)}
.cc-main{display:flex;align-items:center;gap:var(--sp-3);width:100%;padding:var(--sp-3);border:0;background:transparent;text-align:left;color:var(--text)}
div.cc-main{align-items:center}
.cc-main .main{display:flex;flex-direction:column;gap:1px}
.cc-main .plate{font-size:var(--fs-body)}
.cc-side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.visits{display:flex;flex-direction:column;align-items:center;min-width:52px;padding:6px 8px;border-radius:10px;background:var(--primary-50);color:var(--primary-700);font-size:11px;line-height:1.2;text-align:center}
.visits b{font-size:18px;font-weight:var(--fw-bold)}
.cc-due{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);padding:var(--sp-2) var(--sp-3);border-top:1px solid var(--border);background:var(--surface-2)}
.bdg{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.wa{flex:none}.wa.done{color:var(--text-2)}
.sendq{display:flex;flex-direction:column;gap:var(--sp-3);border-color:var(--wa)}
.sq-top{display:flex;justify-content:space-between;align-items:center}.sq-top b{display:flex;align-items:center;gap:6px}
.sq-bar{height:6px;border-radius:var(--r-pill);background:var(--sunk);overflow:hidden}.sq-bar span{display:block;height:100%;background:var(--wa)}
.sq-btns{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2)}
.sendq .plate{font-size:var(--fs-section)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2)}
.cats button{display:flex;align-items:center;gap:var(--sp-2);min-height:56px;padding:var(--sp-2) var(--sp-3);border:1px solid var(--border);background:var(--surface);border-radius:var(--r-btn);font-size:var(--fs-label);font-weight:var(--fw-semibold);text-align:left;box-shadow:var(--sh-1)}
.cats button[aria-pressed="true"]{background:var(--primary-50);border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.cats .ic{font-size:22px}

/* ================= More ================= */
.profile{display:flex;align-items:center;gap:var(--sp-3)}
.profile .main{display:flex;flex-direction:column}.profile b{font-size:var(--fs-section);font-weight:var(--fw-semibold)}
.pf-av{width:48px;height:48px;border-radius:50%;background:var(--navy);color:var(--surface);display:grid;place-items:center;font-size:20px;font-weight:var(--fw-bold);flex:none}
.menu{padding:0;overflow:hidden}
.mrow{display:flex;align-items:center;gap:var(--sp-3);width:100%;min-height:56px;padding:var(--sp-2) var(--sp-4);border:0;border-top:1px solid var(--border);background:transparent;text-align:left;color:var(--text);text-decoration:none;font-size:var(--fs-body);font-weight:var(--fw-medium)}
.mrow:first-child{border-top:0}
.mrow .main{display:flex;flex-direction:column}
.mr-ic{width:36px;height:36px;border-radius:10px;background:var(--sunk);color:var(--text-2);display:grid;place-items:center;flex:none}
.mr-val{font-size:var(--fs-label);color:var(--text-2)}
.mr-go{color:var(--text-3)}
.mrow.danger{color:var(--danger)}.mrow.danger .mr-ic{background:var(--danger-50);color:var(--danger)}
.foot{display:flex;justify-content:center}
.foot .who{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-caption);color:var(--text-3)}
.ver{text-align:center;font-size:11px;color:var(--text-3);margin-top:calc(-1 * var(--sp-3))}

/* ================= Bottom navigation ================= */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:15;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;align-items:end;
  background:var(--surface);border-top:1px solid var(--border);box-shadow:0 -6px 20px rgba(16,45,58,.06);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.bn{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;min-height:52px;padding:4px 2px;border:0;background:transparent;color:var(--text-3);font-size:11px;font-weight:var(--fw-medium);line-height:1.2}
.bn.on{color:var(--primary)}
.bn.on .bn-lb{font-weight:var(--fw-semibold)}
.bn-lb{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bn-main{color:var(--text)}
.bn-fab{width:56px;height:56px;margin-top:-28px;border-radius:18px;display:grid;place-items:center;color:#fff;background:linear-gradient(150deg,var(--primary) 0%,var(--primary-deep) 100%);box-shadow:0 8px 18px rgba(8,127,163,.35);border:4px solid var(--surface)}
.bn:disabled{opacity:.4}
@media (min-width:520px){.bnav,.paybar{left:50%;right:auto;width:480px;transform:translateX(-50%);border-left:1px solid var(--border);border-right:1px solid var(--border);border-radius:20px 20px 0 0}}

/* ================= Toast ================= */
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:30;max-width:90vw;display:flex;align-items:center;gap:var(--sp-2);
  background:var(--navy);color:var(--surface);font-size:var(--fs-label);font-weight:var(--fw-semibold);padding:var(--sp-3) var(--sp-4);border-radius:var(--r-btn);box-shadow:var(--sh-3);animation:toastin .18s ease-out;text-align:left}
.toast .ico{color:var(--success)}
.toast.bad{background:var(--danger);color:#fff}.toast.bad .ico{color:#fff}
@keyframes toastin{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
[hidden]{display:none!important}


/* ================= 4.1: payment confirmation, help, renewal ================= */
body.has-paybar{padding-bottom:calc(260px + env(safe-area-inset-bottom,0px))}
.pb{border:2px solid transparent}
.pb.sel{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--c,var(--primary));transform:translateY(-2px)}
.pb-cash{--c:var(--pay-cash)}.pb-upi{--c:var(--pay-upi)}.pb-card{--c:var(--pay-card)}.pb-credit{--c:var(--pay-later)}
.paybtns:has(.sel) .pb:not(.sel):not(:disabled){opacity:.55}
.payok{margin-top:var(--sp-3);min-height:54px;background:var(--success-600);color:#fff;font-size:var(--fs-btn)}
.payok.later{background:var(--warning)}
.payok:disabled{background:var(--sunk);color:var(--text-3);opacity:1}
.lead{margin:calc(-1 * var(--sp-2)) 0 0;color:var(--text-2);font-size:var(--fs-label)}
.help{display:flex;flex-direction:column;gap:var(--sp-3)}
.help-h{display:flex;align-items:center;gap:var(--sp-3)}.help-h b{font-size:var(--fs-section);font-weight:var(--fw-semibold)}
.steps{margin:0;padding:0;list-style:none;counter-reset:st;display:flex;flex-direction:column;gap:var(--sp-2)}
.steps li{counter-increment:st;display:grid;grid-template-columns:28px 1fr;gap:var(--sp-2);align-items:start;font-size:var(--fs-body);line-height:1.5}
.steps li::before{content:counter(st);width:26px;height:26px;border-radius:50%;background:var(--primary-50);color:var(--primary-700);font-size:13px;font-weight:var(--fw-bold);display:grid;place-items:center}
.renew-st{display:flex;align-items:center;gap:var(--sp-3)}.renew-st b{font-size:var(--fs-section)}
.msgprev{background:var(--surface-2)}
.msgprev pre{margin:0;white-space:pre-wrap;font:inherit;font-size:var(--fs-body);line-height:1.55;color:var(--text)}
.licb{align-items:center;flex-wrap:wrap}.licb .btn{flex:none}

/* ================= Touch areas: every control reacts to at least 48 x 48 px ================= */
.lang,.sync,.back,.btn-sm,.chips button,.btn-icon.x,.brandbtn,.seg button{position:relative}
.lang::after,.sync::after,.back::after,.btn-sm::after,.chips button::after,.btn-icon.x::after,.brandbtn::after{content:"";position:absolute;inset:-6px}
.back{min-height:44px}.seg button{min-height:48px}

/* ================= Small phones ================= */
@media (max-width:360px){
  .pad{grid-template-columns:repeat(3,68px);gap:12px 18px}.pad button{width:68px;height:68px}
  .kpi-v{font-size:22px}.qa-card{min-height:108px;padding:var(--sp-3)}
  .paybtns{gap:6px}.pb{min-height:58px;font-size:12px}
}
</style>

 var c=cleanCode(new URLSearchParams(location.search).get('shop'));
 try{if(c)localStorage.setItem('washbook_shop',c);else c=localStorage.getItem('washbook_shop')||''}catch(e){}

/* Indian Standard Time on every phone (IST = UTC+05:30, no daylight saving), whatever the phone's own time zone */
function istNow(){var d=new Date(Date.now()+330*60000);return {date:d.toISOString().slice(0,10),hm:d.toISOString().slice(11,16)}}
function istToday(){return istNow().date}
function nowHM(){return istNow().hm}
/* a new day in India: yesterday's saved lists are cleared at once, then today's are fetched */
function checkDay(){
 if(!D||!D.today||D.today===istToday())return false;
 D.today=istToday();D.washes=[];D.expenses=[];D.payments=[];D.close=null;saveData();

/* ============ Server calls + save queue ============ */
function call(fn){
 var args=[].slice.call(arguments,1);
 var ctl=typeof AbortController!=='undefined'?new AbortController():null;
 var timer=setTimeout(function(){if(ctl)ctl.abort()},45000);
 return fetch(APP_URL,{method:'POST',body:JSON.stringify({fn:fn,args:args}),redirect:'follow',signal:ctl?ctl.signal:undefined})
  .then(function(r){return r.text()},function(){throw new Error('network: no connection')})
  .then(function(txt){
   clearTimeout(timer);
   var res;try{res=JSON.parse(txt)}catch(e){throw new Error('network: bad response')}
   if(!res.ok)throw new Error(res.error||'error');
   return res.result;
  },function(e){clearTimeout(timer);throw e});
}
function errKind(e){
 var m=String((e&&e.message)||e);
 if(m.indexOf('LOGIN')>=0)return 'login';
 if(m.indexOf('SETUP')>=0)return 'setup';
 if(m.indexOf('NOPERM')>=0)return 'noperm';
 if(m.indexOf('SUSPENDED')>=0)return 'suspended';
 if(m.indexOf('EXPIRED')>=0)return 'expired';
 if(m.indexOf('NOSHOP')>=0)return 'noshop';
 if(/network|http|timeout|connection|failed to fetch|offline/i.test(m))return 'net';
 return 'other';
}

function flush(){
 if(busy||!token)return syncChip();
 if(!Q.length){net='ok';return syncChip()}
 busy=true;syncChip();
 var job=Q[0];
 call('api',SHOP,token,job.op,job.p).then(function(res){
  Q.shift();saveQ();net='ok';busy=false;
  applyResult(job,res);saveData();
  if(view==='home'||view==='close')render();
  flush();
 },function(e){
  busy=false;var k=errKind(e);
  if(k==='login'){return toLogin()}
  if(k==='setup'){fatal=t('setup');return render()}
  if(k==='suspended')return stopApp('suspended');
  if(k==='noshop')return stopApp('noshop');
  if(k==='expired'){net='locked';if(D&&D.licence)D.licence.state='expired';saveData();render();return}
  if(k==='net'){net='off';syncChip();clearTimeout(flush.h);flush.h=setTimeout(flush,15000);return}
  Q.shift();saveQ();
  toast(k==='noperm'?t('askOwner'):t('error')+': '+String((e&&e.message)||e),true);
  refresh(true);

 });
}

function upsertCustomer(c){
 if(!c)return;
 for(var i=0;i<D.customers.length;i++){if(D.customers[i].id===c.id){D.customers[i]=c;return}}
 D.customers.push(c);
}
function remap(oldId,newId){
 if(!oldId||oldId===newId)return;
 D.customers=D.customers.filter(function(c){return c.id!==oldId});
 D.washes.forEach(function(w){if(w.cid===oldId)w.cid=newId});
 Q.forEach(function(j){
  if(j.p.customer&&j.p.customer.id===oldId)j.p.customer.id=newId;
  if(j.p.customerId===oldId)j.p.customerId=newId;
  if(j.op==='addCustomer'&&j.p.id===oldId)j.p.id=newId;
 });
 saveQ();
}
function replaceIn(list,item){for(var i=0;i<list.length;i++){if(list[i].id===item.id){list[i]=item;return}}list.push(item)}
function applyResult(job,res){
 if(!res||res.dup||res.gone)return;
 if(job.op==='addCustomer'){remap(job.p.id,res.customer.id);upsertCustomer(res.customer)}
 if(job.op==='addWash'){remap(job.p.customer.id,res.customer.id);upsertCustomer(res.customer);
   if(res.wash.date===D.today)replaceIn(D.washes,res.wash)}
 if(job.op==='collectDue'){upsertCustomer(res.customer);if(res.payment)replaceIn(D.payments,res.payment)}
 if(job.op==='addExpense'){replaceIn(D.expenses,res.expense)}
 if(job.op==='markOffer'&&res.customer){upsertCustomer(res.customer)}
 if(job.op==='deleteEntry'){upsertCustomer(res.customer)}
 if(job.op==='closeDay'){D.close=res.close}
}

function pdfFromJpeg(jpg,wpx,hpx){   // smallest valid PDF: one page holding one JPEG
 var pw=420,ph=Math.round(420*hpx/wpx),parts=[],off=[],len=0;
 function add(s){var b=typeof s==='string'?Uint8Array.from(s,function(ch){return ch.charCodeAt(0)&255}):s;parts.push(b);len+=b.length}
 function obj(n,body){off[n]=len;add(n+' 0 obj\n');body();add('\nendobj\n')}
 var cs='q '+pw+' 0 0 '+ph+' 0 0 cm /Im0 Do Q';
 add('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
 obj(1,function(){add('<< /Type /Catalog /Pages 2 0 R >>')});
 obj(2,function(){add('<< /Type /Pages /Kids [3 0 R] /Count 1 >>')});
 obj(3,function(){add('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+pw+' '+ph+'] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>')});
 obj(4,function(){add('<< /Type /XObject /Subtype /Image /Width '+wpx+' /Height '+hpx+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpg.length+' >>\nstream\n');add(jpg);add('\nendstream')});
 obj(5,function(){add('<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream')});
 var xr=len,t='xref\n0 6\n0000000000 65535 f \n';
 for(var i=1;i<=5;i++)t+=('000000000'+off[i]).slice(-10)+' 00000 n \n';
 add(t+'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
 var all=new Uint8Array(len),p=0;parts.forEach(function(b){all.set(b,p);p+=b.length});return all;
}

 return pdfFromJpeg(jpg,cv.width,cv.height);
}

 enqueue('collectDue',{id:p.id,at:Date.now(),customerId:c.id,amount:p.amt});
 ui.col=null;toast(t('saved'));render();
}
function deleteEntry(kind,id){
 var list=kind==='wash'?D.washes:kind==='expense'?D.expenses:D.payments,e=null;
 for(var i=0;i<list.length;i++)if(list[i].id===id){e=list[i];list.splice(i,1);break}
 if(!e)return;
 if(kind==='wash'){var c=cust(e.cid);if(c){c.visits=Math.max(0,c.visits-1);if(e.pay==='credit')c.due=Math.max(0,c.due-e.amt)}}
 if(kind==='payment'){var c2=cust(e.cid);if(c2)c2.due+=e.amt}
 enqueue('deleteEntry',{kind:kind,id:id});
 ui.del=null;render();
}
document.addEventListener('click',function(e){
 var wa=e.target.closest&&e.target.closest('a.wa,a.wa-big');
 if(wa&&wa.dataset.cid){
  markOfferSent(wa.dataset.cid);
  if(wa.dataset.seq){ui.si++;setTimeout(render,400)}else setTimeout(render,400);
  return;   // the link itself opens WhatsApp
 }
 var rn=e.target.closest&&e.target.closest('#renew-send');
 if(rn){if(ui.renew==='sending'||ui.renew==='sent'){return}setTimeout(sendRenewal,50);return}   // the link opens WhatsApp; the email goes from Google
 var b=e.target.closest('button');if(!b)return;
 var d=b.dataset;
 if(d.lang){if(ui.offer===t('offerDefault'))ui.offer=null;lang=d.lang;LS.set('lang',lang);render();return}
 if(d.key){
  buzz(8);
  if(d.key==='⌫')ui.pin=(ui.pin||'').slice(0,-1);
  else if(d.key==='✓')return doLogin();
  else if((ui.pin||'').length<8)ui.pin=(ui.pin||'')+d.key;
  pinErr='';render();
  if(ui.pin.length===4)setTimeout(doLogin,120);   // PINs are 4 digits: open as soon as the 4th is typed
  return;
 }
 if(d.go&&isMgr()&&['home','wash','receipt','more','help'].indexOf(d.go)<0)return;
 if(d.go){if(readOnly()&&['home','cust','branches','more','close','help','renew'].indexOf(d.go)<0){toast(t('locked'),true);return}go(d.go);if(d.awaytab){ui.tab='away';render()}if(d.go==='branches')loadBranches();return}
 if(d.startwash){if(readOnly()){toast(t('locked'),true);return}var sc=cust(d.startwash);go('wash');ui.cid=d.startwash;if(sc&&sc.vehicle&&vtGroups().some(function(x){return x.key===sc.vehicle}))ui.vt=sc.vehicle;render();return}
 if(d.vcat){ui.vcat=d.vcat;render();return}
 if(d.switch){switchShop(d.switch);return}
 if(b.id==='rc-done'){go('home');return}
 if(b.id==='rc-pdf'){sharePdf(lastRc);return}
 if(b.id==='sq-start'){startSendAll();return}
 if(b.id==='sq-skip'){ui.si++;render();return}
 if(b.id==='sq-stop'||b.id==='sq-close'){ui.sq=null;render();return}
 if(b.id==='branchbtn'){
  ui.bmenu=!ui.bmenu;render();
  if(ui.bmenu)call('api',SHOP,token,'branches').then(function(res){
   if(!ui.bmenu||view!=='home')return;var m={};res.branches.forEach(function(x){m[x.code]=x});ui.bsum=m;render();
  },function(e){if(errKind(e)==='login')return toLogin();if(ui.bmenu){ui.bsum={};render()}});
  return;
 }
 if(b.id==='sync'){flush();refresh();return}
 if(b.id==='refresh'){flush();var pr=refresh(true);if(pr){b.disabled=true;var ri=b.querySelector('.mr-ic');if(ri)ri.innerHTML='<span class="spinner sm" style="margin:0"></span>';pr.then(function(ok){render();if(ok)toast(t('updated'));else toast(t('noNet'),true)})}return}
 if(b.id==='logout'){var tk=token;if(tk)call('logout',SHOP,tk).catch(function(){});toLogin();return}
 if(d.tab){ui.tab=d.tab;ui.q='';render();return}
 if(d.mo){ui.months=+d.mo;render();return}
 if(d.pick){ui.cid=d.pick;var pc=cust(d.pick);ui.sel=[];
  if(pc&&pc.vehicle&&vtGroups().some(function(x){return x.key===pc.vehicle}))ui.vt=pc.vehicle;
  render();return}
 if(d.vt!==undefined){ui.vt=d.vt;ui.sel=[];render();return}
 if(b.id==='vt-change'){ui.vt=null;ui.sel=[];render();return}
 if(b.id==='unpick'){ui.cid=null;ui.sel=[];render();return}
 if(b.id==='add'){ui.adding=true;render();return}
 if(d.svc){var i=ui.sel.indexOf(d.svc);if(i<0)ui.sel.push(d.svc);else ui.sel.splice(i,1);render();return}
 if(d.pay){ui.pay=d.pay;buzz(8);render();return}
 if(b.id==='pay-ok'){if(ui.pay)saveWash(ui.pay);return}
 if(d.cat){ui.cat=d.cat;render();return}
 if(b.id==='e-save'){saveExpense();return}
 if(d.delask){
  var parts=d.delask.split(':'),kind=parts[0],id=parts.slice(1).join(':');
  var list=kind==='wash'?D.washes:D.expenses,en=list.filter(function(x){return x.id===id})[0];
  if(!en)return;
  if(readOnly()){toast(t('locked'),true);return}
  if(!canDelete(en)){toast(t('askOwner'),true);return}
  ui.del=ui.del===d.delask?null:d.delask;render();return;
 }
 if(d.del){var p2=d.del.split(':');deleteEntry(p2[0],p2.slice(1).join(':'));return}
 if(d.delno){ui.del=null;render();return}
 if(d.colask){if(readOnly()){toast(t('locked'),true);return}ui.col=d.colask;render();return}
 if(d.col){collect(d.col);return}
 if(d.colno){ui.col=null;render();return}
 if(b.id==='day-prev'){loadDay(shiftDay(ui.day||D.today,-1));return}
 if(b.id==='day-next'){var nd=shiftDay(ui.day||D.today,1);loadDay(nd>D.today?D.today:nd);return}
});
document.addEventListener('input',function(e){
 var id=e.target.id;
 if(id==='q'){ui.q=e.target.value;render()}
 else if(id==='n-phone'){ui.nphone=e.target.value;render()}else if(id==='n-plate'){ui.nplate=e.target.value}else if(id==='n-name'){ui.nname=e.target.value}
 else if(id==='shopcode'){ui.code=e.target.value}
 else if(id==='cq'){ui.q=e.target.value;render()}
 else if(id==='amt'){ui.amt=e.target.value.replace(/[^\d]/g,'');render()}
 else if(id==='offer'){ui.offer=e.target.value;
  [].forEach.call(document.querySelectorAll('a.wa,a.wa-big'),function(a){var c=cust(a.getAttribute('data-cid'));if(c)a.setAttribute('href',waLink(c))});}
});
document.addEventListener('submit',function(e){
 e.preventDefault();
 if(e.target.id==='pickform'){var c=cleanCode(document.getElementById('shopcode').value);if(c.length>=4)openShop(c)}
});
document.addEventListener('keydown',function(e){
 if(view==='login'){if(/^\d$/.test(e.key)){ui.pin=(ui.pin||'')+e.key;pinErr='';render();if(ui.pin.length===4)setTimeout(doLogin,120)}else if(e.key==='Backspace'){ui.pin=(ui.pin||'').slice(0,-1);render()}else if(e.key==='Enter')doLogin()}
});
document.addEventListener('visibilitychange',function(){if(document.hidden){hiddenAt=Date.now();return}
 {if(token&&(idleTooLong()||(hiddenAt&&Date.now()-hiddenAt>AWAY_MS)))lockApp();hiddenAt=0;if(!checkDay()){flush();refresh()}}});
['pointerdown','keydown','input','touchstart'].forEach(function(ev){document.addEventListener(ev,function(){if(token&&!locked)touchActive()},true)});
setInterval(function(){if(token&&!locked&&idleTooLong())lockApp();checkDay()},15000);
window.addEventListener('online',function(){flush()});
setInterval(function(){flush();refresh()},5*60*1000);

/* ============ Start ============ */
function boot(){
 if(APP_URL.indexOf('PASTE_')===0){fatal='Set APP_URL in index.html';return render()}
 if(!SHOP){view='pick';ui={code:''};return render()}
 if(!token){view='login';ui={pin:''};render();fetchShopName();return}
 checkDay();
 if(!keepOpen||idleTooLong()){locked=true;view='login';ui={pin:''};render();flush();refresh(!D);return}
 if(D)go('home');else{view='loading';render()}
 flush();refresh(!D);
}
boot();
</script>
