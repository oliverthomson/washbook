<style>
:root{

  --wash:#0A78A0; --cust:#1C8556; --exp:#B86E12; --close:#5040A8;
  --good:#1B8A4A; --good-bg:#DDF3E5; --bad:#C0352A; --bad-bg:#FBE3E0; --warn:#9A6A00; --warn-bg:#FFF1CC;
  --on:#FFFFFF; --wa:#1FA855;
  --logo-bg:#D4ECF4; --logo-drop:#2A9CC6; --logo-win:#CFEAF5;
  --font:"Poppins","Noto Sans Telugu","Nirmala UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0B1A20; --surface:#13262E; --sunk:#0F2027; --ink:#E4F0F3; --muted:#8FA8B3; --line:#24404B;
  --wash:#2A9CC6; --cust:#2EA06C; --exp:#D08A2A; --close:#7565CC;
  --good:#4CC57E; --good-bg:#123826; --bad:#F06E62; --bad-bg:#3D1B18; --warn:#E8B84A; --warn-bg:#3A2E10; --logo-bg:#14313B; --logo-drop:#4FB8DE; --logo-win:#9FD3E6; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.35;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.app{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--wash);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;gap:6px}
.brand{font-weight:800;font-size:20px;flex:1;min-width:0;display:flex;align-items:center;gap:8px;line-height:1.15}
.brand>span:last-child{overflow-wrap:anywhere}
.drop{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--wash);flex:none}
.lang{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;min-width:34px;height:30px;padding:0 8px;font-weight:800;font-size:13px;line-height:1}
.sync{flex:none;font-size:13px;font-weight:800;border-radius:999px;min-width:30px;height:30px;padding:0 8px;background:var(--good-bg);color:var(--good);border:0;line-height:1}
.sync.wait{background:var(--warn-bg);color:var(--warn)} .sync.off{background:var(--bad-bg);color:var(--bad)}
.back{border:0;background:var(--sunk);border-radius:12px;padding:6px 14px;font-weight:700;font-size:17px}

.today{background:var(--surface);border-radius:18px;padding:14px 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border:1px solid var(--line)}
.today.two{grid-template-columns:repeat(2,1fr)}
.today.one{grid-template-columns:1fr}
.bill{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 2px 0 var(--line)}
.bill-head{display:flex;align-items:center;gap:12px;border-bottom:2px dashed var(--line);padding-bottom:12px}
.bill-head .logo{margin:0;flex:none}
.bill-shop{font-size:20px;font-weight:800;line-height:1.2}
.bill-sec{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bill-sec>div{display:flex;flex-direction:column;gap:2px;min-width:0;overflow-wrap:anywhere}
.bill-sec b{font-size:17px}
.bill-items{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.bi{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:16px}
.bi.good{color:var(--good);font-weight:700}
.bi.tot{font-size:22px;font-weight:800;border-bottom:0;padding-top:10px}
.bill-pay{display:flex;align-items:center;gap:8px}
.bill-pay .pay{font-size:14px;padding:3px 12px}
.bill-loyal{background:var(--good-bg);color:var(--good);font-weight:800;border-radius:12px;padding:8px 12px;text-align:center}
.bill-thanks{text-align:center;color:var(--muted);font-weight:700}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 10px;font-size:17px}
.daynav .x{font-size:18px;padding:6px 14px}
.daynav .x:disabled{opacity:.3}
.dash-total{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--wash);color:var(--on);border-radius:20px;padding:16px;font-weight:700}
.dash-total b{font-size:38px;line-height:1.1}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dtile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px;border-left-width:6px}
.dtile .dic{font-size:24px}.dtile .dlb{font-size:14px;font-weight:700;color:var(--muted)}.dtile b{font-size:22px}
.d-cash{border-left-color:var(--good)}.d-upi{border-left-color:var(--close)}.d-card{border-left-color:var(--wash)}.d-credit{border-left-color:var(--bad)}
.sendq{background:var(--surface);border:2px solid var(--wa);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.sq-top{display:flex;justify-content:space-between;align-items:center;font-size:17px}
.sq-bar{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden}
.sq-bar span{display:block;height:100%;background:var(--wa)}
.wa-big{background:var(--wa)}
.sq-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wa.done{background:var(--sunk);color:var(--muted)}
.logo{display:block;max-width:60vw;height:auto;margin-bottom:-6px}
.phonebox{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:15px;color:var(--ink)}
.phonebox input{font-size:22px;font-weight:800;border-width:2px;border-color:var(--wash)}
.phonebox.bad input{border-color:var(--bad)}
.foot{align-items:center}
.foot .who{color:var(--muted);font-size:15px;font-weight:700}
.foot .logout{text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--surface);color:var(--ink);font-weight:700;font-size:14px}
.mhello{display:flex;flex-direction:column;gap:2px;font-size:24px;font-weight:800;line-height:1.2;padding:2px 2px 0}
.mhello span{font-size:14px;font-weight:600;color:var(--muted)}
.mbig{border:0;border-radius:24px;background:var(--wash);color:var(--on);display:flex;align-items:center;gap:16px;padding:22px 20px;min-height:150px;text-align:left;box-shadow:0 4px 0 rgba(0,0,0,.18),0 10px 24px rgba(10,120,160,.25);width:100%}
.mbig:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.mbig:disabled{opacity:.45}
.mic{font-size:58px;line-height:1;flex:none}
.mtx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.mlb{font-size:30px;font-weight:800;line-height:1.1}
.msub{font-size:15px;font-weight:600;opacity:.9}
.marr{font-size:48px;font-weight:300;line-height:1;opacity:.85}
.mcount{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px;font-size:17px;font-weight:700;color:var(--muted)}
.mcount b{font-size:28px;color:var(--ink)}
.duebar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.duebar .collect{margin-top:0;font-size:15px;padding:8px 12px}
.today .k{font-size:13px;color:var(--muted);font-weight:600}
.today .v{font-size:23px;font-weight:800}
.today .date{grid-column:1/-1;font-size:14px;color:var(--muted);font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;border-radius:20px;min-height:128px;padding:14px;color:var(--on);display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.tile:active{transform:translateY(1px)}
.tile .ic{font-size:42px;line-height:1}
.tile .lb{font-size:21px;font-weight:800;line-height:1.15}
.t-wash{background:var(--wash)} .t-cust{background:var(--cust)} .t-exp{background:var(--exp)} .t-close{background:var(--close)}

h1{font-size:26px;margin:0;font-weight:800}
h2{font-size:15px;color:var(--muted);font-weight:700;margin:4px 0 -4px;text-transform:uppercase;letter-spacing:.06em}
.list{background:var(--surface);border-radius:16px;border:1px solid var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left}
.list>.row:first-child,.list>div:first-child>.row{border-top:0}
.row .main{flex:1;min-width:0}
.plate{font-weight:800;font-size:18px;overflow-wrap:anywhere}
.sub{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.amt{font-weight:800;font-size:18px;text-align:right;flex:none}
.pay{font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;display:inline-block}
.p-cash{background:var(--good-bg);color:var(--good)} .p-upi{background:var(--sunk);color:var(--close)} .p-card{background:var(--sunk);color:var(--wash)} .p-credit{background:var(--bad-bg);color:var(--bad)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:var(--bad-bg);color:var(--bad);font-weight:800}
.confirm.go{background:var(--good-bg);color:var(--good)}
.confirm span{flex:1;min-width:140px}
.confirm button{border:0;border-radius:12px;padding:8px 16px;font-weight:800;font-size:16px}
.yes{background:var(--bad);color:var(--on)} .go .yes{background:var(--good)} .no{background:var(--surface)}

.plate-in{width:100%;font-size:24px;font-weight:800;padding:12px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);letter-spacing:.03em;text-transform:uppercase}
.plate-in:focus,.field:focus{border-color:var(--wash);outline:none}
.field{width:100%;font-size:19px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface)}
.match{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:10px;text-align:left}
.match .main{flex:1;min-width:0}
.add{border:2px dashed var(--wash);background:transparent;color:var(--wash);border-radius:16px;padding:12px;font-weight:800;font-size:18px;width:100%}
.picked{background:var(--surface);border:2px solid var(--wash);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center}
.picked .main{flex:1;min-width:0}
.dots{display:flex;gap:4px;margin-top:4px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--wash)}
.dot.on{background:var(--wash)}
.banner{font-weight:800;border-radius:14px;padding:10px 14px;font-size:18px;text-align:center}
.b-good{background:var(--good-bg);color:var(--good)} .b-bad{background:var(--bad-bg);color:var(--bad)} .b-warn{background:var(--warn-bg);color:var(--warn)}
.banner.b-warn,.banner.b-bad{text-align:left;font-size:16px}
.tile:disabled{opacity:.45;cursor:not-allowed}
.x{border:0;background:var(--sunk);border-radius:10px;padding:4px 10px;font-weight:700}

.svc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.svc button{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:12px;text-align:left;min-height:84px;display:flex;flex-direction:column;justify-content:space-between}
.svc button[aria-pressed="true"]{border-color:var(--wash);background:var(--wash);color:var(--on)}
.svc .n{font-weight:700;font-size:17px;line-height:1.2}
.svc .p{font-weight:800;font-size:20px}
.total{display:flex;justify-content:space-between;align-items:baseline;font-size:20px;font-weight:700;padding:4px 2px;gap:8px}
.total b{font-size:30px}
.paybtns{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.paybtns button{border:0;border-radius:18px;padding:14px 6px;color:var(--on);font-weight:800;font-size:18px;display:flex;flex-direction:column;align-items:center;gap:2px}
.paybtns .ic{font-size:30px}
.b-cash{background:var(--good)} .b-upi{background:var(--close)} .b-card{background:var(--wash)} .b-credit{background:var(--bad)}
.paybtns button:disabled,.big:disabled{opacity:.35;cursor:not-allowed}
.hint{font-size:14px;color:var(--muted);text-align:center}

.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cats button{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:12px;font-weight:700;font-size:18px;display:flex;align-items:center;gap:10px;text-align:left}
.cats button[aria-pressed="true"]{border-color:var(--exp);background:var(--exp);color:var(--on)}
.cats .ic{font-size:28px}
.big{border:0;border-radius:18px;padding:16px;font-size:20px;font-weight:800;color:var(--on);width:100%;text-align:center;text-decoration:none;display:block}

.sum .row{padding:8px 14px}
.sum .row.hl{background:var(--sunk)}
.sum .row.hl .main,.sum .row.hl .amt{font-weight:800;font-size:20px}
.note{min-width:58px;font-weight:800;font-size:18px;background:var(--good-bg);color:var(--good);border-radius:10px;padding:4px 8px;text-align:center}
.step{display:flex;align-items:center;gap:6px}
.step button{width:44px;height:44px;border-radius:12px;border:0;background:var(--sunk);font-size:24px;font-weight:800;line-height:1}
.step .c{min-width:34px;text-align:center;font-weight:800;font-size:20px}
.sub-amt{min-width:70px;text-align:right;font-weight:700;color:var(--muted)}
.result{border-radius:18px;padding:16px;text-align:center;font-weight:800}
.result .r1{font-size:22px} .result .r2{font-size:34px}
.report{width:100%;min-height:200px;font:15px/1.45 ui-monospace,Menlo,monospace;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:12px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--sunk);padding:4px;border-radius:16px}
.tabs button{border:0;background:transparent;border-radius:12px;padding:10px 6px;font-weight:800;font-size:17px}
.tabs button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.cnt{background:var(--bad);color:var(--on);border-radius:999px;padding:0 8px;font-size:14px;margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;font-size:16px}
.chips button[aria-pressed="true"]{border-color:var(--cust);background:var(--cust);color:var(--on)}
.wa{flex:none;background:var(--wa);color:#fff;text-decoration:none;font-weight:800;font-size:15px;border-radius:12px;padding:8px 10px;text-align:center;max-width:130px;line-height:1.2}
.collect{flex:none;border:0;background:var(--good);color:var(--on);font-weight:800;font-size:14px;border-radius:12px;padding:6px 10px;margin-top:4px}

.pinbox{display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:20px}
.pinbox .shop{font-size:24px;font-weight:800;text-align:center}
.pindots{display:flex;gap:14px;height:24px}
.pindots span{width:20px;height:20px;border-radius:50%;border:3px solid var(--wash)}
.pindots span.on{background:var(--wash)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.pad button{height:76px;border-radius:50%;border:0;background:var(--surface);font-size:30px;font-weight:800;box-shadow:0 2px 0 var(--line)}
.pad .okk{background:var(--good);color:var(--on)}
.err{color:var(--bad);font-weight:800;min-height:24px;text-align:center}
.foot{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.foot button{border:0;background:transparent;color:var(--muted);text-decoration:underline;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--good);color:var(--on);font-weight:800;font-size:18px;padding:12px 22px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:20;max-width:90vw;text-align:center}
.toast.bad{background:var(--bad)}
.brandbtn{border:0;background:transparent;font:inherit;font-weight:800;color:inherit;padding:0;display:flex;align-items:center;gap:6px;min-width:0;cursor:pointer;text-align:left;line-height:1.15}
.brandbtn span{overflow-wrap:anywhere}
.brandbtn .car{flex:none;font-size:14px;color:var(--muted);transition:transform .15s}
.brandbtn[aria-expanded="true"] .car{transform:rotate(180deg)}
.bmenu{background:var(--surface);border:2px solid var(--wash);border-radius:16px;overflow:hidden;margin-top:-4px}
.bmenu .row{display:flex;align-items:center}
.bmenu .bname{display:block;font-size:18px;font-weight:800}
.bmenu .btot{font-weight:800;background:var(--sunk);justify-content:space-between}
.bmenu .row.here{background:var(--sunk)}
.bmenu .tick{color:var(--wash);font-weight:800}
.allb{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;display:flex;justify-content:space-between;font-weight:800;font-size:17px;color:var(--ink)}
.row.here{background:var(--sunk)}
.newveh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:2px dashed var(--wash);border-radius:16px;padding:10px 14px;font-size:16px}
.linkbtn{border:0;background:transparent;color:var(--wash);font-weight:800;font-size:15px;padding:4px 0;text-decoration:underline}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vgrid button{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:12px;display:flex;align-items:center;gap:10px;text-align:left;min-height:64px}
.vgrid .vic{font-size:28px;flex:none}
.vgrid .vn{font-weight:800;font-size:16px;line-height:1.2;min-width:0;overflow-wrap:anywhere}
.vchosen{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--wash);border-radius:16px;padding:10px 12px;font-size:17px}
.vchosen .vic{font-size:28px}
.vchosen b{flex:1;min-width:0;overflow-wrap:anywhere}
.ver{text-align:center;font-size:12px;color:var(--muted);margin-top:-6px}
.center{text-align:center;padding:40px 0;font-size:20px;font-weight:700;color:var(--muted)}
</style>

var APP_URL='https://script.google.com/macros/s/AKfycbwW24Q07XEZu6LPLIUu4K8tEw_HjYYRxjsZoBzhzycrCetpC5A2r-YpENNc2BB6FWz12A/exec';
var APP_VERSION='3.3';   // must match APP_VERSION in Code.gs

function cleanCode(c){return String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'')}
var SHOP=(function(){
 var c=cleanCode(new URLSearchParams(location.search).get('shop'));
 try{if(c)localStorage.setItem('washbook_shop',c);else c=localStorage.getItem('washbook_shop')||''}catch(e){}
 return c;
})();
var LS={
 key:function(k){return 'wk_'+SHOP+'_'+k},
 get:function(k,d){try{var v=localStorage.getItem(LS.key(k));return v==null?d:JSON.parse(v)}catch(e){return d}},
 set:function(k,v){try{localStorage.setItem(LS.key(k),JSON.stringify(v))}catch(e){}},
 del:function(k){try{localStorage.removeItem(LS.key(k))}catch(e){}}
};
var lang=LS.get('lang','te'), token=LS.get('token',null), D=LS.get('data',null), Q=LS.get('queue',[]);
var view='home', ui={}, net='ok', busy=false, pinErr='', fatal='';

/* ============ Small helpers ============ */
function t(k){return (T[lang]&&T[lang][k])||T.en[k]||k}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rs(n){n=Number(n||0);return (n<0?'−':'')+'₹'+Math.abs(n).toLocaleString('en-IN')}
/* Indian Standard Time on every phone (IST = UTC+05:30, no daylight saving), whatever the phone's own time zone */
function istNow(){var d=new Date(Date.now()+330*60000);return {date:d.toISOString().slice(0,10),hm:d.toISOString().slice(11,16)}}
function istToday(){return istNow().date}
function nowHM(){return istNow().hm}
/* a new day in India: yesterday's saved lists are cleared at once, then today's are fetched */
function checkDay(){
 if(!D||!D.today||D.today===istToday())return false;
 D.today=istToday();D.washes=[];D.expenses=[];D.payments=[];D.close=null;saveData();
 if(view==='home'||view==='close')render();
 refresh(true);
 return true;
}
function newId(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function saveData(){LS.set('data',D)}
function saveQ(){LS.set('queue',Q)}
function cust(id){for(var i=0;i<D.customers.length;i++)if(D.customers[i].id===id)return D.customers[i];return null}
function svc(id){for(var i=0;i<D.services.length;i++)if(D.services[i].id===id)return D.services[i];return null}
function svcNames(w){
 var ss=w.svc.map(svc).filter(Boolean);if(!ss.length)return w.names;
 var v=ss[0].vt?(lang==='te'?ss[0].vtte:ss[0].vt)+' · ':'';
 return v+ss.map(function(s){return s[lang]}).join(' + ');
}
/* services grouped by vehicle type, in the order of the Services sheet */
function vtGroups(){
 var out=[],idx={};
 D.services.forEach(function(s){
  var k=s.vt||'';
  if(!(k in idx)){idx[k]=out.length;out.push({key:k,en:k||t('otherVeh'),te:k?(s.vtte||k):t('otherVeh'),ic:k?(s.vic||'🚗'):'🧽',list:[]})}
  out[idx[k]].list.push(s);
 });
 return out;
}
function normPlate(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'')}
function isoLocal(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function daysSince(d){if(!d)return null;var base=D&&D.today?D.today:isoLocal(new Date());return Math.round((new Date(base+'T00:00:00')-new Date(d+'T00:00:00'))/864e5)}
function ago(d){var n=daysSince(d);if(n===null)return t('never');if(n<=0)return t('d0');if(n===1)return t('d1');if(n<30)return t('dN').replace('{n}',n);var m=Math.floor(n/30);return m===1?t('m1'):t('mN').replace('{n}',m)}
function waNum(p){var d=String(p).replace(/\D/g,'');var cc=(D&&D.settings.countryCode)||'91';if(d.charAt(0)==='0')d=d.slice(1);if(d.length===10)d=cc+d;return d}
function phoneDigits(p){var d=String(p||'').replace(/\D/g,'');if(d.length===12&&d.slice(0,2)==='91')d=d.slice(2);if(d.length===11&&d.charAt(0)==='0')d=d.slice(1);return d}
function phoneOk(p){return phoneDigits(p).length===10}
function phoneBox(){
 var bad=ui.nphone&&!phoneOk(ui.nphone);
 return '<label class="phonebox'+(bad?' bad':'')+'"><span>📞 '+t('mobileReq')+' *</span><input class="field num" id="n-phone" inputmode="tel" maxlength="14" placeholder="98xxxxxxxx" value="'+esc(ui.nphone||'')+'"></label>';
}
function isMgr(){return !!(D&&D.user&&D.user.role!=='owner')}
function isFree(c){var n=D.settings.loyaltyEvery;return n>0&&c.visits%n===n-1}
function minsAgo(hm){var a=nowHM().split(':'),b=String(hm).split(':');return (+a[0]*60+ +a[1])-(+b[0]*60+ +b[1])}
function canDelete(e){return D.user.role==='owner'||(e.staff===D.user.name&&minsAgo(e.t)<=15)}

function dots(v){var n=D.settings.loyaltyEvery;if(!n)return '';var k=v%n,h='<div class="dots">';for(var i=0;i<n;i++)h+='<span class="dot '+(i<k?'on':'')+'"></span>';return h+'</div>'}

 var cash=by('cash'),upi=by('upi'),card=by('card'),credit=by('credit'),collected=s(D.payments),exp=s(D.expenses),opening=D.settings.openingCash||0;
 var cnt=getCounts(),counted=NOTES.reduce(function(a,n){return a+n*(cnt[n]||0)},0);
 return {cash:cash,upi:upi,card:card,credit:credit,collected:collected,exp:exp,opening:opening,sales:cash+upi+card+credit,

/* ============ Server calls + save queue ============ */
function call(fn){
 var args=[].slice.call(arguments,1);
 var ctl=typeof AbortController!=='undefined'?new AbortController():null;
 var timer=setTimeout(function(){if(ctl)ctl.abort()},45000);
 return fetch(APP_URL,{method:'POST',body:JSON.stringify({fn:fn,args:args}),redirect:'follow',signal:ctl?ctl.signal:undefined})
  .then(function(r){return r.text()},function(){throw new Error('network: no connection')})
  .then(function(txt){
   clearTimeout(timer);
   var res;try{res=JSON.parse(txt)}catch(e){throw new Error('network: bad response')}
   if(!res.ok)throw new Error(res.error||'error');
   return res.result;
  },function(e){clearTimeout(timer);throw e});
}
function errKind(e){
 var m=String((e&&e.message)||e);
 if(m.indexOf('LOGIN')>=0)return 'login';
 if(m.indexOf('SETUP')>=0)return 'setup';
 if(m.indexOf('NOPERM')>=0)return 'noperm';
 if(m.indexOf('SUSPENDED')>=0)return 'suspended';
 if(m.indexOf('EXPIRED')>=0)return 'expired';
 if(m.indexOf('NOSHOP')>=0)return 'noshop';
 if(/network|http|timeout|connection|failed to fetch|offline/i.test(m))return 'net';
 return 'other';
}
function enqueue(op,p){if(readOnly()){toast(t('locked'),true);return}Q.push({op:op,p:p});saveQ();saveData();flush()}

function flush(){
 if(busy||!token)return syncChip();
 if(!Q.length){net='ok';return syncChip()}
 busy=true;syncChip();
 var job=Q[0];
 call('api',SHOP,token,job.op,job.p).then(function(res){
  Q.shift();saveQ();net='ok';busy=false;
  applyResult(job,res);saveData();
  if(view==='home'||view==='close')render();
  flush();
 },function(e){
  busy=false;var k=errKind(e);
  if(k==='login'){return toLogin()}
  if(k==='setup'){fatal=t('setup');return render()}
  if(k==='suspended')return stopApp('suspended');
  if(k==='noshop')return stopApp('noshop');
  if(k==='expired'){net='locked';if(D&&D.licence)D.licence.state='expired';saveData();render();return}
  if(k==='net'){net='off';syncChip();clearTimeout(flush.h);flush.h=setTimeout(flush,15000);return}
  Q.shift();saveQ();
  toast(k==='noperm'?t('askOwner'):t('error')+': '+String((e&&e.message)||e),true);
  refresh(true);
  flush();
 });
}

function upsertCustomer(c){
 if(!c)return;
 for(var i=0;i<D.customers.length;i++){if(D.customers[i].id===c.id){D.customers[i]=c;return}}
 D.customers.push(c);
}
function remap(oldId,newId){
 if(!oldId||oldId===newId)return;
 D.customers=D.customers.filter(function(c){return c.id!==oldId});
 D.washes.forEach(function(w){if(w.cid===oldId)w.cid=newId});
 Q.forEach(function(j){
  if(j.p.customer&&j.p.customer.id===oldId)j.p.customer.id=newId;
  if(j.p.customerId===oldId)j.p.customerId=newId;
  if(j.op==='addCustomer'&&j.p.id===oldId)j.p.id=newId;
 });
 saveQ();
}
function replaceIn(list,item){for(var i=0;i<list.length;i++){if(list[i].id===item.id){list[i]=item;return}}list.push(item)}
function applyResult(job,res){
 if(!res||res.dup||res.gone)return;
 if(job.op==='addCustomer'){remap(job.p.id,res.customer.id);upsertCustomer(res.customer)}
 if(job.op==='addWash'){remap(job.p.customer.id,res.customer.id);upsertCustomer(res.customer);
   if(res.wash.date===D.today)replaceIn(D.washes,res.wash)}
 if(job.op==='collectDue'){upsertCustomer(res.customer);if(res.payment)replaceIn(D.payments,res.payment)}
 if(job.op==='addExpense'){replaceIn(D.expenses,res.expense)}
 if(job.op==='markOffer'&&res.customer){upsertCustomer(res.customer)}
 if(job.op==='deleteEntry'){upsertCustomer(res.customer)}
 if(job.op==='closeDay'){D.close=res.close}
}

function refresh(force){
 if(!token||(busy&&!force)||(Q.length&&net!=='locked'&&!force))return;
 call('api',SHOP,token,'refresh').then(function(res){
  var dayChanged=!D||D.today!==res.today;
  D=res;saveData();fatal='';
  if(net==='locked'&&res.licence.state!=='expired'){net='ok';flush()}
  if(view==='loading'||dayChanged){go('home')}
  else if(view==='home'||view==='cust')render();
  else syncChip();
 },function(e){
  var k=errKind(e);
  if(k==='login')return toLogin();
  if(k==='setup'){fatal=t('setup');return render()}
  if(k==='suspended')return stopApp('suspended');
  if(k==='noshop')return stopApp('noshop');
  net='off';syncChip();
 });
}

/* ---------- lock after 5 minutes without use; the PIN is checked on the phone, so it unlocks offline too ---------- */
var IDLE_MS=5*60*1000,AWAY_MS=2*60*1000,locked=false,keepOpen=false,hiddenAt=0;   // PIN: on every app start, after 5 min idle, or after 2 min away in another app
function pinHash(p){var h=2166136261,str='wb:'+p;for(var i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),16777619)>>>0}return h.toString(36)}
function touchActive(force){var n=Date.now();if(force||n-(touchActive.l||0)>5000){touchActive.l=n;LS.set('active',n)}}
function idleTooLong(){var a=LS.get('active',0);return !a||Date.now()-a>IDLE_MS}

function pdfFromJpeg(jpg,wpx,hpx){   // smallest valid PDF: one page holding one JPEG
 var pw=420,ph=Math.round(420*hpx/wpx),parts=[],off=[],len=0;
 function add(s){var b=typeof s==='string'?Uint8Array.from(s,function(ch){return ch.charCodeAt(0)&255}):s;parts.push(b);len+=b.length}
 function obj(n,body){off[n]=len;add(n+' 0 obj\n');body();add('\nendobj\n')}
 var cs='q '+pw+' 0 0 '+ph+' 0 0 cm /Im0 Do Q';
 add('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
 obj(1,function(){add('<< /Type /Catalog /Pages 2 0 R >>')});
 obj(2,function(){add('<< /Type /Pages /Kids [3 0 R] /Count 1 >>')});
 obj(3,function(){add('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+pw+' '+ph+'] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>')});
 obj(4,function(){add('<< /Type /XObject /Subtype /Image /Width '+wpx+' /Height '+hpx+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpg.length+' >>\nstream\n');add(jpg);add('\nendstream')});
 obj(5,function(){add('<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream')});
 var xr=len,t='xref\n0 6\n0000000000 65535 f \n';
 for(var i=1;i<=5;i++)t+=('000000000'+off[i]).slice(-10)+' 00000 n \n';
 add(t+'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
 var all=new Uint8Array(len),p=0;parts.forEach(function(b){all.set(b,p);p+=b.length});return all;
}
function invoicePdf(rc){
 var cv=invoiceCanvas(rc);if(!cv)return null;
 var b=atob(cv.toDataURL('image/jpeg',0.9).split(',')[1]),jpg=new Uint8Array(b.length);
 for(var i=0;i<b.length;i++)jpg[i]=b.charCodeAt(i);
 return pdfFromJpeg(jpg,cv.width,cv.height);
}
